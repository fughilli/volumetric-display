<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Data Management · Midnight Renegade Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        font-family: "Space Mono", "Segoe UI", sans-serif;
        background: #050505;
        color: #fff;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 1rem 1.5rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .hamburger {
        position: relative;
        width: 24px;
        height: 24px;
        cursor: pointer;
        z-index: 1000;
      }
      .hamburger span {
        display: block;
        position: absolute;
        height: 2px;
        width: 100%;
        background: #fff;
        transition: all 0.3s ease;
      }
      .hamburger span:nth-child(1) {
        top: 4px;
      }
      .hamburger span:nth-child(2) {
        top: 11px;
      }
      .hamburger span:nth-child(3) {
        top: 18px;
      }
      .hamburger.active span:nth-child(1) {
        top: 11px;
        transform: rotate(45deg);
      }
      .hamburger.active span:nth-child(2) {
        opacity: 0;
      }
      .hamburger.active span:nth-child(3) {
        top: 11px;
        transform: rotate(-45deg);
      }
      .menu-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        z-index: 999;
        display: none;
        align-items: flex-start;
        justify-content: flex-end;
        padding: 1rem;
      }
      .menu-overlay.active {
        display: flex;
      }
      .menu-panel {
        background: #1a1a1a;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 18px;
        padding: 1.5rem;
        min-width: 240px;
        max-width: 90vw;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      }
      .menu-panel a {
        display: block;
        padding: 0.75rem 1rem;
        color: #fff;
        text-decoration: none;
        border-radius: 8px;
        margin-bottom: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 0.9rem;
      }
      .menu-panel a:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .menu-panel hr {
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        margin: 1rem 0;
      }
      main {
        flex: 1;
        padding: 2rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 1.5rem;
      }
      section {
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      h2 {
        margin: 0;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      button {
        padding: 0.6rem 1.25rem;
        border-radius: 999px;
        border: none;
        font-size: 0.9rem;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-weight: 600;
      }
      button.primary {
        background: #00ffc6;
        color: #050505;
      }
      button.secondary {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
      }
      textarea {
        width: 100%;
        min-height: 160px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(0, 0, 0, 0.4);
        color: #fff;
        font-family: "Space Mono", monospace;
        padding: 0.8rem;
        resize: vertical;
      }
      .status {
        font-size: 0.85rem;
        opacity: 0.85;
        min-height: 1.2rem;
      }
    </style>
  </head>
  <body>
    <header>
      <span>Admin · Data Management</span>
      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </header>
    <div class="menu-overlay" id="menu-overlay">
      <div class="menu-panel">
        <a href="/admin">Map View</a>
        <a href="/admin/beacons">Beacon Table</a>
        <a href="/admin/spirits">Spirits</a>
        <a href="/admin/data">Data</a>
        <hr />
        <a href="/admin/logout">Logout</a>
      </div>
    </div>
    <main>
      <section>
        <h2>Export JSON</h2>
        <button class="secondary" id="download-beacons">Download Beacons</button>
        <button class="secondary" id="download-spirits">Download Spirits</button>
      </section>
      <section>
        <h2>Import Beacons</h2>
        <p>Paste JSON with shape <code>{"beacons": [...]}</code> or an array of records.</p>
        <textarea id="beacons-json" placeholder='{"beacons": [{"id": "...", "lat": 0.0, ...}]}'></textarea>
        <button class="primary" id="import-beacons">Import Beacons</button>
        <div class="status" id="beacons-status"></div>
      </section>
      <section>
        <h2>Import Spirits</h2>
        <p>Paste JSON with shape <code>{"spirits": [...]}</code> or an array of records.</p>
        <textarea id="spirits-json" placeholder='{"spirits": [{"id": "...", "name": "...", ...}]}'></textarea>
        <button class="primary" id="import-spirits">Import Spirits</button>
        <div class="status" id="spirits-status"></div>
      </section>
    </main>

    <script>
      function downloadJson(url, filename) {
        fetch(url)
          .then((response) => response.json())
          .then((data) => {
            const blob = new Blob([JSON.stringify(data, null, 2)], {
              type: "application/json",
            });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          });
      }

      document.getElementById("download-beacons").addEventListener("click", () => {
        downloadJson("/api/admin/beacons/export", "beacons.json");
      });

      document.getElementById("download-spirits").addEventListener("click", () => {
        downloadJson("/api/admin/spirits/export", "spirits.json");
      });

      async function submitImport(url, rawText, statusEl, wrapperKey) {
        try {
            const parsed = JSON.parse(rawText);
            const payload = Array.isArray(parsed) ? { [wrapperKey]: parsed } : parsed;
            const response = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            if (!response.ok) {
              const err = await response.json().catch(() => ({}));
              throw new Error(err.detail || response.statusText);
            }
            const result = await response.json();
            statusEl.textContent = `✅ Imported ${result.imported ?? ""} records`;
        } catch (err) {
            statusEl.textContent = `⚠️ ${err.message}`;
        }
      }

      document.getElementById("import-beacons").addEventListener("click", () => {
        const raw = document.getElementById("beacons-json").value.trim();
        const statusEl = document.getElementById("beacons-status");
        statusEl.textContent = "Uploading…";
        submitImport("/api/admin/beacons/import", raw, statusEl, "beacons");
      });

      document.getElementById("import-spirits").addEventListener("click", () => {
        const raw = document.getElementById("spirits-json").value.trim();
        const statusEl = document.getElementById("spirits-status");
        statusEl.textContent = "Uploading…";
        submitImport("/api/admin/spirits/import", raw, statusEl, "spirits");
      });

      const hamburger = document.getElementById("hamburger");
      const menuOverlay = document.getElementById("menu-overlay");
      hamburger.addEventListener("click", () => {
        hamburger.classList.toggle("active");
        menuOverlay.classList.toggle("active");
      });
      menuOverlay.addEventListener("click", (e) => {
        if (e.target === menuOverlay) {
          hamburger.classList.remove("active");
          menuOverlay.classList.remove("active");
        }
      });
    </script>
  </body>
</html>
