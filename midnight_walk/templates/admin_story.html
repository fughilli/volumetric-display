<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Story Log Management · Midnight Renegade Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        font-family: "Space Mono", "Segoe UI", sans-serif;
        background: #050505;
        color: #fff;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 1rem 1.5rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .hamburger {
        position: relative;
        width: 24px;
        height: 24px;
        cursor: pointer;
        z-index: 1000;
      }
      .hamburger span {
        display: block;
        position: absolute;
        height: 2px;
        width: 100%;
        background: #fff;
        transition: all 0.3s ease;
      }
      .hamburger span:nth-child(1) {
        top: 4px;
      }
      .hamburger span:nth-child(2) {
        top: 11px;
      }
      .hamburger span:nth-child(3) {
        top: 18px;
      }
      .hamburger.active span:nth-child(1) {
        top: 11px;
        transform: rotate(45deg);
      }
      .hamburger.active span:nth-child(2) {
        opacity: 0;
      }
      .hamburger.active span:nth-child(3) {
        top: 11px;
        transform: rotate(-45deg);
      }
      .menu-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        z-index: 999;
        display: none;
        align-items: flex-start;
        justify-content: flex-end;
        padding: 1rem;
      }
      .menu-overlay.active {
        display: flex;
      }
      .menu-panel {
        background: #1a1a1a;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 18px;
        padding: 1.5rem;
        min-width: 240px;
        max-width: 90vw;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      }
      .menu-panel a {
        display: block;
        padding: 0.75rem 1rem;
        color: #fff;
        text-decoration: none;
        border-radius: 8px;
        margin-bottom: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 0.9rem;
      }
      .menu-panel a:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .menu-panel hr {
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        margin: 1rem 0;
      }
      main {
        flex: 1;
        padding: 2rem;
        overflow-y: auto;
      }
      .controls {
        display: flex;
        gap: 1rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
      }
      button {
        padding: 0.6rem 1.5rem;
        border-radius: 999px;
        border: none;
        font-size: 0.9rem;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 600;
      }
      button.primary {
        background: #00ffc6;
        color: #050505;
      }
      button.danger {
        background: #ff6b6b;
        color: #fff;
      }
      button.secondary {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      .story-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .story-item {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
      }
      .story-item-content {
        flex: 1;
      }
      .story-item time {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.6);
        display: block;
        margin-bottom: 0.5rem;
      }
      .story-item p {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      .story-item-actions {
        display: flex;
        gap: 0.5rem;
      }
      .story-item-actions button {
        padding: 0.4rem 0.8rem;
        font-size: 0.8rem;
      }
      .status-message {
        margin-bottom: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        background: rgba(0, 255, 198, 0.1);
        border: 1px solid rgba(0, 255, 198, 0.3);
        display: none;
      }
      .status-message.show {
        display: block;
      }
      .status-message.error {
        background: rgba(255, 107, 107, 0.1);
        border-color: rgba(255, 107, 107, 0.3);
      }
    </style>
  </head>
  <body>
    <header>
      <span>Story Log Management</span>
      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </header>
    <div class="menu-overlay" id="menu-overlay">
      <div class="menu-panel">
        <a href="/admin">Map View</a>
        <a href="/admin/beacons">Beacon Table</a>
        <a href="/admin/spirits">Spirits</a>
        <a href="/admin/minigames">Minigames</a>
        <a href="/admin/rift-gate">Demonic Portal</a>
        <a href="/admin/story">Story Log</a>
        <a href="/admin/data">Data</a>
        <hr />
        <a href="/admin/logout">Logout</a>
      </div>
    </div>
    <main>
      <div class="controls">
        <button class="secondary" id="refresh-btn">Refresh</button>
        <button class="danger" id="clear-all-btn">Clear All Events</button>
      </div>
      <div class="status-message" id="status-message"></div>
      <ul class="story-list" id="story-list">
        <li class="story-item">
          <div class="story-item-content">
            <time>Loading...</time>
            <p>Fetching story events...</p>
          </div>
        </li>
      </ul>
    </main>

    <script>
      function formatTime(isoString) {
        const date = isoString ? new Date(isoString) : null;
        if (!date || Number.isNaN(date.getTime())) return "--:--";
        return date.toLocaleString([], {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function showStatus(message, isError = false) {
        const statusMsg = document.getElementById("status-message");
        statusMsg.textContent = message;
        statusMsg.className = `status-message show${isError ? " error" : ""}`;
        setTimeout(() => {
          statusMsg.classList.remove("show");
        }, 3000);
      }

      async function fetchStoryEvents() {
        const response = await fetch("/api/admin/story?limit=200");
        if (!response.ok) {
          throw new Error("Failed to fetch story events");
        }
        const data = await response.json();
        return data.events || [];
      }

      function renderStoryEvents(events) {
        const list = document.getElementById("story-list");
        if (events.length === 0) {
          list.innerHTML = `
            <li class="story-item">
              <div class="story-item-content">
                <p>No story events yet.</p>
              </div>
            </li>
          `;
          return;
        }
        list.innerHTML = events
          .map(
            (event) => `
          <li class="story-item">
            <div class="story-item-content">
              <time>${formatTime(event.createdAt)}</time>
              <p>${event.message}</p>
            </div>
            <div class="story-item-actions">
              <button class="danger" onclick="deleteEvent('${event.id}')">Delete</button>
            </div>
          </li>
        `
          )
          .join("");
      }

      async function loadStoryEvents() {
        try {
          const events = await fetchStoryEvents();
          renderStoryEvents(events);
        } catch (err) {
          console.error("Failed to load story events:", err);
          showStatus("Failed to load story events", true);
        }
      }

      async function deleteEvent(eventId) {
        if (!confirm("Delete this story event?")) {
          return;
        }
        try {
          const response = await fetch(`/api/admin/story/${eventId}`, {
            method: "DELETE",
          });
          if (!response.ok) {
            throw new Error("Failed to delete event");
          }
          showStatus("Event deleted");
          await loadStoryEvents();
        } catch (err) {
          console.error("Failed to delete event:", err);
          showStatus("Failed to delete event", true);
        }
      }

      window.deleteEvent = deleteEvent;

      async function clearAllEvents() {
        if (
          !confirm(
            "Are you sure you want to delete ALL story events? This cannot be undone."
          )
        ) {
          return;
        }
        try {
          const response = await fetch("/api/admin/story", {
            method: "DELETE",
          });
          if (!response.ok) {
            throw new Error("Failed to clear story log");
          }
          showStatus("All story events cleared");
          await loadStoryEvents();
        } catch (err) {
          console.error("Failed to clear story log:", err);
          showStatus("Failed to clear story log", true);
        }
      }

      document.getElementById("refresh-btn").addEventListener("click", loadStoryEvents);
      document.getElementById("clear-all-btn").addEventListener("click", clearAllEvents);

      const hamburger = document.getElementById("hamburger");
      const menuOverlay = document.getElementById("menu-overlay");
      hamburger.addEventListener("click", () => {
        hamburger.classList.toggle("active");
        menuOverlay.classList.toggle("active");
      });
      menuOverlay.addEventListener("click", (e) => {
        if (e.target === menuOverlay) {
          hamburger.classList.remove("active");
          menuOverlay.classList.remove("active");
        }
      });

      loadStoryEvents();
    </script>
  </body>
</html>
